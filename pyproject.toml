[project]
name = "hass-opencode-go-conversation"
version = "0.1.0"
description = "Home Assistant custom integration for OpenCode Go"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14.2"
dependencies = [
    "voluptuous-openapi==0.4.1",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    "homeassistant==2026.7.4",
    "hassil>=3.10.0",
    "home-assistant-intents>=2026.6.24",
    "aiodiscover>=3.3.2",
    "pre-commit==4.6.1",
    "ruff==0.16.2",
    "ty==0.0.63",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-homeassistant-custom-component==0.13.348",
    "pytest-asyncio==1.4.0",
    "async-timeout",
]

# ── Ruff (replaces flake8 + isort) ────────────────────────────────────────────

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.opencode_go_conversation"]
combine-as-imports = true

# ── Pytest ─────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
addopts = "-qq --cov=custom_components.opencode_go_conversation"
console_output_style = "count"
asyncio_mode = "auto"
testpaths = ["tests"]

# ── Coverage ───────────────────────────────────────────────────────────────────

[tool.coverage.run]
branch = false

[tool.coverage.report]
show_missing = true
